<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Content Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeaf8; --surface:#ffffff; --ink:#1d1640; --muted:#6b6590; --line:#d9d1ee;
  --accent:#e6246b; --accent-ink:#ffffff; --accent2:#5b3fd1; --ok:#1a8f5c; --err:#c0262d;
  --new:#f3effd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16112e; --surface:#211a45; --ink:#f1ecff; --muted:#a79fcf; --line:#38306b;
    --accent:#ff4d8d; --accent-ink:#1d1640; --accent2:#a99bff; --ok:#4cd39a; --err:#ff7b80; --new:#2a2257;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:6px 6px 0 var(--accent2)}
label{display:block;font-weight:700;margin:18px 0 6px}
label:first-child{margin-top:0}
.hint{font-weight:400;color:var(--muted);font-size:.88rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 13px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-color:var(--accent2)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:12px 20px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.go{background:var(--accent);color:var(--accent-ink);width:100%;font-size:1.2rem;padding:15px;margin-top:24px;letter-spacing:.02em}
.primary{background:var(--accent);color:var(--accent-ink)}
details{margin-top:22px;border-top:2px dashed var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.err{color:var(--err);font-weight:500;margin-top:14px;white-space:pre-wrap}
.hidden{display:none!important}
/* results */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;margin-bottom:6px;border-bottom:2px solid var(--line)}
.bar .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.stat{font-weight:700}
.stat small{font-weight:400;color:var(--muted)}
.meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.batchhead{margin:26px 0 10px;font-weight:700;color:var(--accent2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini{padding:6px 12px;font-size:.9rem}
.item{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.item.new{background:var(--new)}
.status{margin-top:12px;font-weight:500}
.status.ok{color:var(--ok)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- PAGE 1 -->
<section id="pageInput">
  <h1>Trend content generator</h1>
  <p class="sub">Fill in the event details, press Go, and get 100 fresh compliments per round.</p>
  <div class="card">
    <label for="keywords">Keywords <span class="hint">(separated by commas)</span></label>
    <input id="keywords" type="text" placeholder="e.g. stage presence, vocals, visuals">

    <label for="event">Event name</label>
    <input id="event" type="text" placeholder="e.g. Fan Meeting 2026">

    <label for="tags">Tagline &amp; hashtags <span class="hint">(optional)</span></label>
    <textarea id="tags" placeholder="e.g. Forever with James #JamesDay #ForeverJames"></textarea>

    <details id="settings">
      <summary>Settings</summary>
      <label for="apikey">Access code <span class="hint">(only needed if the site owner set one)</span></label>
      <input id="apikey" type="password" autocomplete="off" placeholder="Enter access code">
      <div class="row">
        <div>
          <label for="limit">Max characters per comment</label>
          <input id="limit" type="number" min="40" max="500" value="190">
        </div>
        <div>
          <label for="tagMode">Tagline &amp; hashtags</label>
          <select id="tagMode" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 13px">
            <option value="none">Don't add to comments</option>
            <option value="append">Add at the end (not counted in limit)</option>
            <option value="inside">Inside the comment (counted in limit)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="idol">Idol name</label>
          <input id="idol" type="text" value="James">
        </div>
      </div>
    </details>

    <div id="err1" class="err hidden"></div>
    <button id="goBtn" class="go">Go</button>
  </div>
</section>

<!-- PAGE 2 -->
<section id="pageResults" class="hidden">
  <div class="bar">
    <div class="stat"><span id="total">0</span> compliments <small id="eventLabel"></small></div>
    <div class="meta" id="tagLabel"></div>
    <div class="actions">
      <button id="copyLastBtn" class="primary">Copy latest round</button>
      <button id="copyBtn">Copy all</button>
      <button id="contBtn">Continue</button>
      <button id="docsBtn">Export to Google Docs</button>
      <button id="backBtn">New event</button>
    </div>
    <div class="progress hidden" id="progWrap"><i id="prog"></i></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</section>

</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

// restore saved fields
['apikey','idol','keywords','event','tags','limit'].forEach(id=>{
  const v = store.get('tcg_'+id); if(v) $(id).value = v;
});
if(store.get('tcg_tagMode')) $('tagMode').value = store.get('tcg_tagMode');

const state = { items:[], batches:[], seen:new Set(), busy:false, params:null };

const BATCH_TOTAL = 100;
const CHUNKS = 5;                 // 5 parallel calls x 20 = 100 per round
const PER_CHUNK = BATCH_TOTAL / CHUNKS;

const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const wc = s => s.trim().split(/\s+/).filter(Boolean).length;
function sig(s){ return norm(s).split(' ').slice(0,12).join(' '); }

function setStatus(msg, ok){ const s=$('status'); s.textContent=msg||''; s.className='status'+(ok?' ok':''); }
function setBusy(b){
  state.busy=b;
  ['goBtn','copyBtn','copyLastBtn','contBtn','docsBtn','backBtn'].forEach(id=>$(id).disabled=b);
  $('progWrap').classList.toggle('hidden',!b);
}

const ANGLES = [
  'heartfelt and emotional','hype, energetic and excited','poetic and admiring',
  'proud-fan, supportive and grateful','witty, playful and affectionate',
  'detailed praise about talent and hard work','warm, sincere and personal',
  'celebratory, as if watching live','short punchy lines','storytelling about the moment',
  'thankful and inspired','dreamy and romantic admiration'
];

async function callApi(p, count, avoid, angle){
  const res = await fetch('/api/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-access-code':p.code},
    body:JSON.stringify({
      keywords:p.keywords, event:p.event, tags:p.tags, incTags:p.tagMode==='inside',
      limit:p.limit, idol:p.idol, count, avoid, angle
    })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data.items||[];
}

const clen = s => [...s].length;
function acceptable(text, p){
  return !!text && clen(text) <= p.limit;
}

async function generateRound(){
  const p = state.params;
  setBusy(true); setStatus('Generating…'); $('prog').style.width='4%';
  const avoid = state.items.slice(-150).map(t=>t.split(/\s+/).slice(0,7).join(' '));
  const accepted = [];
  let errors = [], tooLong = 0, passes = 0;
  const MAX_PASSES = 4;

  while(accepted.length < BATCH_TOTAL && passes < MAX_PASSES){
    passes++;
    const need = BATCH_TOTAL - accepted.length;
    const chunks = need > 30 ? CHUNKS : Math.max(1, Math.ceil(need/20));
    const per = Math.ceil(need/chunks) + (passes===1 ? 6 : 12);   // ask for extras to cover rejects
    const angleStart = Math.floor(Math.random()*ANGLES.length);
    const localAvoid = avoid.concat(accepted.map(t=>t.split(/\s+/).slice(0,7).join(' ')));
    let fresh = [], done = 0;

    await Promise.all(Array.from({length:chunks},(_,i)=>(async()=>{
      const angle = ANGLES[(angleStart+i*2)%ANGLES.length]+' / '+ANGLES[(angleStart+i*2+1)%ANGLES.length];
      try{ fresh.push(...await callApi(p, per, localAvoid, angle)); }
      catch(e){ errors.push(e.message); }
      done++; $('prog').style.width = (4 + ((passes-1)+done/chunks)/MAX_PASSES*96)+'%';
    })()));

    for(const raw of fresh){
      const t = raw.trim();
      if(!acceptable(t,p)){ tooLong++; continue; }
      const key = norm(t), sg = sig(t);
      if(state.seen.has(key) || state.seen.has('s:'+sg)) continue;
      state.seen.add(key); state.seen.add('s:'+sg);
      accepted.push(p.tagMode==='append' && p.tags ? t+' '+p.tags : t);
      if(accepted.length>=BATCH_TOTAL) break;
    }
    if(!fresh.length) break;           // nothing came back, stop retrying
    if(accepted.length < BATCH_TOTAL) setStatus(`Generating… ${accepted.length}/${BATCH_TOTAL}`);
  }

  if(accepted.length){
    state.items.push(...accepted);
    state.batches.push(accepted);
    renderBatch(accepted, state.batches.length);
    $('total').textContent = state.items.length;
    let msg = `Added ${accepted.length} new compliments.`;
    if(tooLong) msg += ` ${tooLong} over ${p.limit} characters were discarded.`;
    if(accepted.length<BATCH_TOTAL) msg += ` Press Continue to top up.`;
    if(errors.length) msg += ` Some requests failed: ${errors[0]}`;
    setStatus(msg, !errors.length);
  } else {
    setStatus('Nothing was generated. '+(errors[0]||'Try again.'));
  }
  setBusy(false);
  return accepted.length>0;
}

function renderBatch(items, n){
  const list = $('list');
  list.querySelectorAll('.item.new').forEach(el=>el.classList.remove('new'));
  const h = document.createElement('div');
  h.className='batchhead';
  const ht=document.createElement('span'); ht.textContent=`Round ${n} · ${items.length} compliments`;
  const hb=document.createElement('button'); hb.type='button'; hb.className='mini'; hb.textContent='Copy this round';
  hb.onclick=async()=>{ const ok=await copyText(joinText(items)); setStatus(ok?`Copied round ${n} (${items.length} compliments).`:'Copy failed. Select the text manually.', ok); };
  h.append(ht,hb);
  list.appendChild(h);
  items.forEach(t=>{
    const d=document.createElement('div'); d.className='item new'; d.textContent=t; list.appendChild(d);
  });
  h.scrollIntoView({behavior:'smooth',block:'start'});
}

const joinText = arr => arr.join('\n\n');   // 1 extra blank line between each
function fullText(){ return joinText(state.items); }

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}

// --- events ---
$('goBtn').onclick = async ()=>{
  const e1=$('err1'); e1.classList.add('hidden');
  const p = {
    keywords:$('keywords').value.split(',').map(s=>s.trim()).filter(Boolean),
    event:$('event').value.trim(),
    tags:$('tags').value.trim(),
    tagMode:$('tagMode').value,
    limit:Math.max(40,parseInt($('limit').value,10)||190),
    code:$('apikey').value.trim(),
    idol:$('idol').value.trim()||'James'
  };
  const missing=[];
  if(!p.keywords.length) missing.push('keywords');
  if(!p.event) missing.push('event name');
  if(missing.length){ e1.textContent='Please fill in: '+missing.join(', ')+'.'; e1.classList.remove('hidden'); return; }
  ['apikey','idol','keywords','event','tags','limit'].forEach(id=>store.set('tcg_'+id,$(id).value));
  store.set('tcg_tagMode',$('tagMode').value);

  // reset session
  state.params=p; state.items=[]; state.batches=[]; state.seen=new Set();
  $('list').innerHTML=''; $('total').textContent='0';
  $('eventLabel').textContent='for '+p.event; $('tagLabel').textContent=(p.tags||'')+' · max '+p.limit+' characters'+(p.tagMode==='append'&&p.tags?' + hashtags':'');
  $('pageInput').classList.add('hidden'); $('pageResults').classList.remove('hidden');
  window.scrollTo(0,0);
  await generateRound();
};

$('contBtn').onclick = ()=>generateRound();

$('copyBtn').onclick = async ()=>{
  if(!state.items.length) return setStatus('Nothing to copy yet.');
  const ok = await copyText(fullText());
  setStatus(ok?`Copied all ${state.items.length} compliments from ${state.batches.length} round(s).`:'Copy failed. Select the text manually.', ok);
};

$('copyLastBtn').onclick = async ()=>{
  const last = state.batches[state.batches.length-1];
  if(!last) return setStatus('Nothing to copy yet.');
  const ok = await copyText(joinText(last));
  setStatus(ok?`Copied round ${state.batches.length} (${last.length} compliments).`:'Copy failed. Select the text manually.', ok);
};

$('docsBtn').onclick = async ()=>{
  if(!state.items.length) return setStatus('Nothing to export yet.');
  const ok = await copyText(fullText());
  window.open('https://docs.new','_blank','noopener');
  setStatus(ok?'Copied. A new Google Doc opened. Press Ctrl+V (Cmd+V on Mac) to paste.':'A new Google Doc opened, but copying failed. Use Copy first.', ok);
};

$('backBtn').onclick = ()=>{
  if(state.items.length && !confirm('Go back? The current results will be cleared.')) return;
  $('pageResults').classList.add('hidden'); $('pageInput').classList.remove('hidden'); window.scrollTo(0,0);
};
</script>
</body>
</html>
