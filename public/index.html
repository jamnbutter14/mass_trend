<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Content Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeaf8; --surface:#ffffff; --ink:#1d1640; --muted:#6b6590; --line:#d9d1ee;
  --accent:#e6246b; --accent-ink:#ffffff; --accent2:#5b3fd1; --ok:#1a8f5c; --err:#c0262d;
  --new:#f3effd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16112e; --surface:#211a45; --ink:#f1ecff; --muted:#a79fcf; --line:#38306b;
    --accent:#ff4d8d; --accent-ink:#1d1640; --accent2:#a99bff; --ok:#4cd39a; --err:#ff7b80; --new:#2a2257;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:6px 6px 0 var(--accent2)}
label{display:block;font-weight:700;margin:18px 0 6px}
label:first-child{margin-top:0}
.hint{font-weight:400;color:var(--muted);font-size:.88rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 13px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-color:var(--accent2)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:12px 20px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.go{background:var(--accent);color:var(--accent-ink);width:100%;font-size:1.2rem;padding:15px;margin-top:24px;letter-spacing:.02em}
.primary{background:var(--accent);color:var(--accent-ink)}
details{margin-top:22px;border-top:2px dashed var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.err{color:var(--err);font-weight:500;margin-top:14px;white-space:pre-wrap}
.hidden{display:none!important}
/* results */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;margin-bottom:6px;border-bottom:2px solid var(--line)}
.tune{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.tune label{margin:0;font-weight:700;font-size:.9rem}
.tune input{padding:7px 10px}
.moodpick{position:relative;display:inline-block;width:100%}
.moodpick summary{list-style:none;cursor:pointer;font-weight:400;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:11px 13px;display:flex;justify-content:space-between;gap:10px}
.moodpick summary::-webkit-details-marker{display:none}
.moodpick summary::after{content:"\25BE"}
.tune .moodpick{width:260px}.tune .moodpick summary{padding:7px 10px}
.moodpick summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moodlist{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:100%;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:6px;box-shadow:4px 4px 0 var(--accent2)}
.moodlist label{display:flex;align-items:center;gap:8px;margin:0;padding:7px 8px;font-weight:400;cursor:pointer;border-radius:6px;white-space:nowrap}
.moodlist label:hover{background:var(--new)}
.moodlist input{width:auto}
.moodlist .sub2{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.bar .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.stat{font-weight:700}
.stat small{font-weight:400;color:var(--muted)}
.meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.batchhead{margin:26px 0 10px;font-weight:700;color:var(--accent2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini{padding:6px 12px;font-size:.9rem}
.item{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.item.new{background:var(--new)}
.status{margin-top:12px;font-weight:500}
.status.ok{color:var(--ok)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- PAGE 1 -->
<section id="pageInput">
  <h1>Trend content generator</h1>
  <p class="sub">Fill in the event details, press Go, and get a fresh batch of compliments each round.</p>
  <div class="card">
    <label for="keywords">Keywords <span class="hint">(separated by commas)</span></label>
    <input id="keywords" type="text" placeholder="e.g. stage presence, vocals, visuals">

    <label for="event">Event name <span class="hint">(optional)</span></label>
    <input id="event" type="text" placeholder="Leave empty for general compliments">

    <label for="tags">Tagline &amp; hashtags <span class="hint">(optional)</span></label>
    <textarea id="tags" placeholder="e.g. Forever with James #JamesDay #ForeverJames"></textarea>

    <div class="row">
      <div>
        <label for="perRound">Comments per round</label>
        <input id="perRound" type="number" min="1" max="500" value="100">
      </div>
      <div>
        <label for="model">Gemini model</label>
        <input id="model" type="text" list="modelList" value="gemini-3.8-flash" autocomplete="off">
      </div>
    </div>
    <datalist id="modelList">
      <option value="gemini-3.8-flash">
      <option value="gemini-3.7-flash">
      <option value="gemini-3.6-flash">
      <option value="gemini-3.5-flash">
      <option value="gemini-3.5-flash-lite">
      <option value="gemini-3.1-flash-lite">
    </datalist>

    <details id="settings">
      <summary>Settings</summary>
      <label for="apikey">Access code <span class="hint">(only needed if the site owner set one)</span></label>
      <input id="apikey" type="password" autocomplete="off" placeholder="Enter access code">
      <div class="row">
        <div>
          <label for="limit">Max characters per comment</label>
          <input id="limit" type="number" min="40" max="500" value="190">
        </div>
        <div>
          <label for="tagMode">Tagline &amp; hashtags</label>
          <select id="tagMode" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 13px">
            <option value="none">Don't add to comments</option>
            <option value="append">Add at the end (not counted in limit)</option>
            <option value="inside">Inside the comment (counted in limit)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Mood / tone <span class="hint">(tick one or more)</span></label>
          <details class="moodpick" id="moodPick"></details>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="directPct">Spoken directly to him (%)</label>
          <input id="directPct" type="number" min="0" max="100" value="30">
          <div class="hint">The rest talk about him in the third person.</div>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="idol">Idol name</label>
          <input id="idol" type="text" value="James">
        </div>
      </div>
    </details>

    <div id="err1" class="err hidden"></div>
    <button id="goBtn" class="go">Go</button>
  </div>
</section>

<!-- PAGE 2 -->
<section id="pageResults" class="hidden">
  <div class="bar">
    <div class="stat"><span id="total">0</span> compliments <small id="eventLabel"></small></div>
    <div class="meta" id="tagLabel"></div>
    <div class="tune">
      <label for="perRoundBar">Next round</label>
      <input id="perRoundBar" type="number" min="1" max="500" value="100" style="width:90px">
      <label>Tone</label>
      <details class="moodpick" id="moodPickBar"></details>
      <label for="modelBar">Model</label>
      <input id="modelBar" type="text" list="modelList" autocomplete="off" style="width:210px">
    </div>
    <div class="actions">
      <button id="copyLastBtn" class="primary">Copy latest round</button>
      <button id="copyBtn">Copy all</button>
      <button id="contBtn">Continue</button>
      <button id="docsBtn">Export to Google Docs</button>
      <button id="backBtn">New event</button>
    </div>
    <div class="progress hidden" id="progWrap"><i id="prog"></i></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</section>

</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

// restore saved fields
['apikey','idol','keywords','event','tags','limit','perRound','model','directPct'].forEach(id=>{
  const v = store.get('tcg_'+id); if(v) $(id).value = v;
});
if(store.get('tcg_tagMode')) $('tagMode').value = store.get('tcg_tagMode');


// ---- mood picker (multi-select dropdown) ----
const MOODS=[['optimistic','Optimistic & Hopeful'],['happy','Happy & Joyful'],['awed','Awed & Amazement'],['funny','Funny & Witty'],['relaxed','Relaxed & Natural']];
let moodSel=new Set(MOODS.map(m=>m[0]));
try{ const saved=JSON.parse(store.get('tcg_moods')||'null'); if(Array.isArray(saved)&&saved.length) moodSel=new Set(saved.filter(k=>MOODS.some(m=>m[0]===k))); }catch(e){}
if(!moodSel.size) moodSel=new Set(MOODS.map(m=>m[0]));
function currentTones(){ return moodSel.size?[...moodSel]:MOODS.map(m=>m[0]); }
function moodLabel(){ return moodSel.size===MOODS.length?'Mixed (all moods)':MOODS.filter(m=>moodSel.has(m[0])).map(m=>m[1]).join(', '); }
function renderMood(){
  document.querySelectorAll('.moodpick').forEach(box=>{
    box.querySelector('summary span').textContent=moodLabel();
    box.querySelectorAll('input[data-mood]').forEach(i=>{ i.checked=moodSel.has(i.dataset.mood); });
  });
}
document.querySelectorAll('.moodpick').forEach(box=>{
  box.innerHTML='<summary><span></span></summary><div class="moodlist">'+
    MOODS.map(m=>`<label><input type="checkbox" data-mood="${m[0]}"> ${m[1].replace('&','&amp;')}</label>`).join('')+
    '<label class="sub2"><input type="checkbox" data-all="1"> Select all (mixed)</label></div>';
  box.addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.all){ moodSel=new Set(t.checked?MOODS.map(m=>m[0]):[MOODS[0][0]]); }
    else if(t.dataset.mood){ t.checked?moodSel.add(t.dataset.mood):moodSel.delete(t.dataset.mood); if(!moodSel.size) moodSel.add(t.dataset.mood); }
    store.set('tcg_moods',JSON.stringify([...moodSel]));
    renderMood();
    box.querySelectorAll('input[data-all]').forEach(i=>i.checked=moodSel.size===MOODS.length);
  });
});
document.addEventListener('click',e=>{ document.querySelectorAll('.moodpick[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); });
renderMood();
document.querySelectorAll('input[data-all]').forEach(i=>i.checked=moodSel.size===MOODS.length);

const state = { items:[], batches:[], seen:new Set(), busy:false, params:null };

const REQ_SIZE = 20;              // comments requested per API call
const WAVE = 5;                   // API calls run at the same time

const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const wc = s => s.trim().split(/\s+/).filter(Boolean).length;
function sig(s){ return norm(s).split(' ').slice(0,12).join(' '); }

function setStatus(msg, ok){ const s=$('status'); s.textContent=msg||''; s.className='status'+(ok?' ok':''); }
function setBusy(b){
  state.busy=b;
  document.querySelectorAll('.moodpick').forEach(x=>{x.style.pointerEvents=b?'none':'';x.style.opacity=b?.5:'';});
  ['goBtn','copyBtn','copyLastBtn','contBtn','docsBtn','backBtn','perRoundBar','modelBar'].forEach(id=>$(id).disabled=b);
  $('progWrap').classList.toggle('hidden',!b);
}

const ANGLES_GENERAL = [
  'heartfelt and emotional','hype, energetic and excited','poetic and admiring',
  'proud-fan, supportive and grateful','witty, playful and affectionate','detailed praise about talent and hard work',
  'warm, sincere and personal','short punchy lines','thankful and inspired','dreamy and romantic admiration',
  'admiring personality and kindness','encouraging and uplifting','fun and cheeky','bold, confident fan energy'
];
const ANGLES_EVENT_ONLY = ['celebratory, as if watching live','storytelling about the moment'];
const ANGLES = [
  'heartfelt and emotional','hype, energetic and excited','poetic and admiring',
  'proud-fan, supportive and grateful','witty, playful and affectionate',
  'detailed praise about talent and hard work','warm, sincere and personal',
  'celebratory, as if watching live','short punchy lines','storytelling about the moment',
  'thankful and inspired','dreamy and romantic admiration'
];

async function callApi(p, count, avoid, angle){
  const res = await fetch('/api/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-access-code':p.code},
    body:JSON.stringify({
      keywords:p.keywords, event:p.event, tags:p.tags, incTags:p.tagMode==='inside', model:p.model,
      limit:p.limit, idol:p.idol, directPct:p.directPct, tones:p.tones, count, avoid, angle
    })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data.items||[];
}

const clen = s => [...s].length;
function acceptable(text, p){
  return !!text && clen(text) <= p.limit;
}

async function generateRound(){
  const p = state.params;
  setBusy(true); setStatus('Generating…'); $('prog').style.width='4%';
  const avoid = state.items.slice(-150).map(t=>t.split(/\s+/).slice(0,7).join(' '));
  const accepted = [];
  let errors = [], tooLong = 0, passes = 0;
  const MAX_PASSES = 4;

  const total = p.perRound;
  let limitHit = false;

  while(accepted.length < total && passes < MAX_PASSES && !limitHit){
    passes++;
    const need = total - accepted.length;
    const extra = passes===1 ? 0.25 : 0.5;                 // ask for extras to cover rejects
    const sizes = [];
    for(let r=need; r>0; r-=REQ_SIZE) sizes.push(Math.min(REQ_SIZE, r));
    const AL = p.event ? ANGLES_GENERAL.concat(ANGLES_EVENT_ONLY) : ANGLES_GENERAL;
    const angleStart = Math.floor(Math.random()*AL.length);
    const localAvoid = avoid.concat(accepted.map(t=>t.split(/\s+/).slice(0,7).join(' ')));
    let fresh = [], done = 0;

    for(let w=0; w<sizes.length && !limitHit; w+=WAVE){
      await Promise.all(sizes.slice(w,w+WAVE).map(async (sz,k)=>{
        const i = w+k;
        const angle = AL[(angleStart+i*2)%AL.length]+' / '+AL[(angleStart+i*2+1)%AL.length];
        try{ fresh.push(...await callApi(p, sz+Math.ceil(sz*extra), localAvoid, angle)); }
        catch(e){
          errors.push(e.message);
          if(/quota|rate|limit|exhaust|too many|429/i.test(e.message)) limitHit = true;
        }
        done++; $('prog').style.width = (4 + ((passes-1)+done/sizes.length)/MAX_PASSES*96)+'%';
      }));
    }

    for(const raw of fresh){
      const t = raw.trim();
      if(!acceptable(t,p)){ tooLong++; continue; }
      const key = norm(t), sg = sig(t);
      if(state.seen.has(key) || state.seen.has('s:'+sg)) continue;
      state.seen.add(key); state.seen.add('s:'+sg);
      accepted.push(p.tagMode==='append' && p.tags ? t+' '+p.tags : t);
      if(accepted.length>=total) break;
    }
    if(!fresh.length) break;           // nothing came back, stop retrying
    if(accepted.length < total && !limitHit) setStatus(`Generating… ${accepted.length}/${total}`);
  }

  if(accepted.length){
    state.items.push(...accepted);
    state.batches.push(accepted);
    renderBatch(accepted, state.batches.length);
    $('total').textContent = state.items.length;
    let msg = `Added ${accepted.length} new compliments.`;
    if(tooLong) msg += ` ${tooLong} over ${p.limit} characters were discarded.`;
    if(accepted.length<total) msg += limitHit ? ` The model's limit was reached after ${accepted.length}/${total}. Wait a minute or pick another model above, then press Continue.` : ` Press Continue to top up.`;
    if(errors.length) msg += ` Some requests failed: ${errors[0]}`;
    setStatus(msg, !errors.length);
  } else {
    setStatus('Nothing was generated. '+(errors[0]||'Try again.')+(limitHit?' Wait a minute or pick another model above, then press Continue.':''));
  }
  setBusy(false);
  return accepted.length>0;
}

function renderBatch(items, n){
  const list = $('list');
  list.querySelectorAll('.item.new').forEach(el=>el.classList.remove('new'));
  const h = document.createElement('div');
  h.className='batchhead';
  const ht=document.createElement('span'); ht.textContent=`Round ${n} · ${items.length} compliments`;
  const hb=document.createElement('button'); hb.type='button'; hb.className='mini'; hb.textContent='Copy this round';
  hb.onclick=async()=>{ const ok=await copyText(joinText(items)); setStatus(ok?`Copied round ${n} (${items.length} compliments).`:'Copy failed. Select the text manually.', ok); };
  h.append(ht,hb);
  list.appendChild(h);
  items.forEach(t=>{
    const d=document.createElement('div'); d.className='item new'; d.textContent=t; list.appendChild(d);
  });
  h.scrollIntoView({behavior:'smooth',block:'start'});
}

const joinText = arr => arr.join('\n\n');   // 1 extra blank line between each
function fullText(){ return joinText(state.items); }

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}

// --- events ---
$('goBtn').onclick = async ()=>{
  const e1=$('err1'); e1.classList.add('hidden');
  const p = {
    keywords:$('keywords').value.split(',').map(s=>s.trim()).filter(Boolean),
    event:$('event').value.trim(),
    directPct:(()=>{const v=parseInt($('directPct').value,10);return Number.isFinite(v)?Math.min(100,Math.max(0,v)):30;})(),
    tones:currentTones(),
    perRound:Math.min(500,Math.max(1,parseInt($('perRound').value,10)||100)),
    model:$('model').value.trim()||'gemini-3.8-flash',
    tags:$('tags').value.trim(),
    tagMode:$('tagMode').value,
    limit:Math.max(40,parseInt($('limit').value,10)||190),
    code:$('apikey').value.trim(),
    idol:$('idol').value.trim()||'James'
  };
  const missing=[];
  if(!p.keywords.length) missing.push('keywords');
  if(missing.length){ e1.textContent='Please fill in: '+missing.join(', ')+'.'; e1.classList.remove('hidden'); return; }
  ['apikey','idol','keywords','event','tags','limit','perRound','model','directPct'].forEach(id=>store.set('tcg_'+id,$(id).value));
  store.set('tcg_tagMode',$('tagMode').value);
  $('perRoundBar').value=p.perRound; $('modelBar').value=p.model;

  // reset session
  state.params=p; state.items=[]; state.batches=[]; state.seen=new Set();
  $('list').innerHTML=''; $('total').textContent='0';
  $('eventLabel').textContent=p.event?'for '+p.event:''; $('tagLabel').textContent=(p.tags||'')+' · max '+p.limit+' characters'+(p.tagMode==='append'&&p.tags?' + hashtags':'');
  $('pageInput').classList.add('hidden'); $('pageResults').classList.remove('hidden');
  window.scrollTo(0,0);
  await generateRound();
};

$('contBtn').onclick = ()=>{
  const p = state.params;
  p.perRound = Math.min(500,Math.max(1,parseInt($('perRoundBar').value,10)||p.perRound));
  p.model = $('modelBar').value.trim() || p.model;
  p.tones = currentTones();
  $('perRoundBar').value = p.perRound; $('modelBar').value = p.model;
  store.set('tcg_perRound',p.perRound); store.set('tcg_model',p.model);
  $('perRound').value = p.perRound; $('model').value = p.model;
  return generateRound();
};

$('copyBtn').onclick = async ()=>{
  if(!state.items.length) return setStatus('Nothing to copy yet.');
  const ok = await copyText(fullText());
  setStatus(ok?`Copied all ${state.items.length} compliments from ${state.batches.length} round(s).`:'Copy failed. Select the text manually.', ok);
};

$('copyLastBtn').onclick = async ()=>{
  const last = state.batches[state.batches.length-1];
  if(!last) return setStatus('Nothing to copy yet.');
  const ok = await copyText(joinText(last));
  setStatus(ok?`Copied round ${state.batches.length} (${last.length} compliments).`:'Copy failed. Select the text manually.', ok);
};

$('docsBtn').onclick = async ()=>{
  if(!state.items.length) return setStatus('Nothing to export yet.');
  const ok = await copyText(fullText());
  window.open('https://docs.new','_blank','noopener');
  setStatus(ok?'Copied. A new Google Doc opened. Press Ctrl+V (Cmd+V on Mac) to paste.':'A new Google Doc opened, but copying failed. Use Copy first.', ok);
};

$('backBtn').onclick = ()=>{
  if(state.items.length && !confirm('Go back? The current results will be cleared.')) return;
  $('pageResults').classList.add('hidden'); $('pageInput').classList.remove('hidden'); window.scrollTo(0,0);
};
</script>
</body>
</html>
